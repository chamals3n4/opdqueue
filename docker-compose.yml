services:
  postgres:
    image: postgres:16-alpine
    container_name: opdqueue-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-opdqueue}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - opdqueue_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  opdqueue_pgdata:
